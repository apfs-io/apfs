# Video Transcoding Workflow
#
# Uses local ffmpeg procedures (video-transcode, video-thumbnail).
# Requires a worker with the "video" tag (ubuntu-media image).
#
# Produces:
#   prim.mp4  — the original, re-encoded to H.264 @ 1080p (prime)
#   small.mp4 — H.264 @ 480p
#   thumb.jpg — frame at 00:00:01
#
# Bucket/group: videos

version: "3"
name: video-transcode
description: Re-encode the uploaded video to H.264 MP4, then derive an SD copy and a thumbnail.

content_types:
  - video/mp4
  - video/quicktime
  - video/x-msvideo

keep_original: false

validate:
  max_size: 2GB
  content_types:
    - video/mp4
    - video/quicktime
    - video/x-msvideo

# Runs before every job and overwrites the original (prim.<ext>).
prime:
  runs-on: video
  steps:
    - name: ffmpeg-prime
      uses: procedure
      with:
        name: video-transcode
        height: "1080"
        crf: "22"

jobs:
  sd:
    runs-on: video
    steps:
      - name: ffmpeg-sd
        uses: procedure
        with:
          name: video-transcode
          height: "480"
          crf: "26"
          target: small.mp4

  thumbnail:
    runs-on: video
    steps:
      - name: ffmpeg-thumb
        uses: procedure
        with:
          name: video-thumbnail
          time: "00:00:01"
          target: thumb.jpg
