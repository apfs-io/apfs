# Video Transcoding Workflow
#
# Uses local ffmpeg procedures (video-transcode, video-thumbnail).
# Requires a worker with the "video" tag (ubuntu-media image).
#
# Produces:
#   main.mp4  — H.264 @ 1080p
#   small.mp4 — H.264 @ 480p
#   thumb.jpg — frame at 00:00:01
#
# Bucket/group: videos

version: "2"
name: video-transcode
description: Transcode uploaded video to HD/SD MP4 and extract a thumbnail.

content_types:
  - video/mp4
  - video/quicktime
  - video/x-msvideo

keep_original: false

validate:
  max_size: 2GB
  content_types:
    - video/mp4
    - video/quicktime
    - video/x-msvideo

jobs:
  hd:
    runs-on: video
    steps:
      - name: ffmpeg-hd
        uses: procedure
        with:
          name: video-transcode
          height: "1080"
          crf: "22"
          target: main.mp4

  sd:
    runs-on: video
    steps:
      - name: ffmpeg-sd
        uses: procedure
        with:
          name: video-transcode
          height: "480"
          crf: "26"
          target: small.mp4

  thumbnail:
    runs-on: video
    steps:
      - name: ffmpeg-thumb
        uses: procedure
        with:
          name: video-thumbnail
          time: "00:00:01"
          target: thumb.jpg
